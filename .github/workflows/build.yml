name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Compilar
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log
      - name: Mostrar erros
        if: failure()
        run: |
          { grep -E '^e: ' build.log; grep -A3 'What went wrong' build.log; } | sed 's|file:///home/runner/work/Iptv/Iptv/||' | head -14 | tr '\n' ' ' > erros.txt
          echo "::error::ERROS: $(cat erros.txt)"
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK com link fixo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: IPTV Player (ultima versao)
          files: app/build/outputs/apk/debug/app-debug.apk
